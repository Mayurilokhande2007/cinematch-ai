<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaMatch AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;800&family=Kaushan+Script&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; color: #F3F4F6; min-height: 100vh; margin: 0; overflow: hidden; }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        
        .bg-blended-gradient {
            background-color: #0A1931;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23FFFFFF' fill-opacity='0.03' transform='rotate(-15 200 200)'%3E%3Cg transform='translate(50, 80) scale(0.8)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(250, 40) scale(0.6)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(120, 250) scale(1.0)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(320, 280) scale(0.7)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(200, 150) scale(0.5)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"), linear-gradient(180deg, #040D21 0%, #0A1931 50%, #004080 100%);
            background-attachment: fixed;
            background-size: auto, cover;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(10, 25, 49, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .btn-primary {
            background: linear-gradient(to right, #00B4D8, #0077B6);
            color: white; border-radius: 8px; font-weight: 600; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 180, 216, 0.6); }

        .ai-gradient-text {
            font-family: 'Kaushan Script', cursive;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #00B4D8, #0077B6);
            display: inline-block;
            padding-right: 5px;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes fadeOutLogo {
            to { opacity: 0; visibility: hidden; }
        }
        .splash-anim {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999998;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: popUp 1.5s 0.2s forwards, fadeOutLogo 0.5s 3.5s forwards;
        }
    </style>
</head>
<body class="bg-blended-gradient">

    <!-- Splash Screen -->
    <div id="page-splash" class="fixed inset-0 bg-black z-50 flex items-center justify-center">
        <div class="splash-anim">
            <div style="display: flex; flex-direction: column; align-items: center; width: 400px;">
                <svg width="110" height="75" viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="25" y="45" width="70" height="45" rx="3" fill="#FFFFFF"/>
                    <polygon points="52,57 52,77 70,67" fill="#0F1115"/>
                    <polygon points="25,40 22,25 92,15 95,30" fill="#FFFFFF"/>
                    <polygon points="35,38 32,23 42,22 45,37" fill="#0F1115"/>
                    <polygon points="55,35 52,20 62,19 65,34" fill="#0F1115"/>
                    <polygon points="75,32 72,17 82,16 85,31" fill="#0F1115"/>
                    <rect x="90" y="45" width="4" height="4" fill="#00B4D8"/>
                    <rect x="98" y="50" width="5" height="5" fill="#0077B6"/>
                    <rect x="93" y="60" width="3" height="3" fill="#00B4D8"/>
                    <rect x="105" y="55" width="6" height="6" fill="#0077B6"/>
                    <rect x="115" y="40" width="4" height="4" fill="#00B4D8"/>
                    <rect x="100" y="35" width="5" height="5" fill="#0077B6"/>
                    <rect x="110" y="25" width="3" height="3" fill="#00B4D8"/>
                    <rect x="95" y="20" width="4" height="4" fill="#0077B6"/>
                </svg>
                <div style="font-size: 45px; line-height: 1.2; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; width: 100%; white-space: nowrap; overflow: visible;">
                    <span style="font-family: 'Kaushan Script', cursive; color: #FFFFFF; font-weight: 400;">CinemaMatch</span>
                    <span class="ai-gradient-text">AI</span>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; margin-top: 5px; gap: 10px; width: 100%;">
                    <div style="height: 1.5px; width: 35px; background-color: #0077B6;"></div>
                    <span style="font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 2px; color: #E0E0E0; text-transform: uppercase;">AI RECOMMENDS. YOU ENJOY.</span>
                    <div style="height: 1.5px; width: 35px; background-color: #0077B6;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth / Reset Container -->
    <div id="auth-container" class="hidden min-h-screen items-center justify-center p-4 bg-blended-gradient"></div>

    <!-- Main Dashboard Container -->
    <div id="app" class="hidden flex h-screen overflow-hidden bg-blended-gradient">
        <aside id="sidebar" class="w-64 glass-card border-r border-gray-800 p-5 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="text-center mb-6 scale-75 origin-top">
                    <svg width="90" height="60" viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="25" y="45" width="70" height="45" rx="3" fill="#FFFFFF"/>
                        <polygon points="52,57 52,77 70,67" fill="#0F1115"/>
                        <polygon points="25,40 22,25 92,15 95,30" fill="#FFFFFF"/>
                        <rect x="90" y="45" width="4" height="4" fill="#00B4D8"/>
                        <rect x="98" y="50" width="5" height="5" fill="#0077B6"/>
                    </svg>
                    <div class="text-xl flex items-center justify-center gap-1 mt-1">
                        <span style="font-family: 'Kaushan Script', cursive; color: #FFFFFF;">CinemaMatch</span>
                        <span class="ai-gradient-text">AI</span>
                    </div>
                </div>
                <p id="userDisplay" class="text-xs text-center text-gray-300 mb-4">User: Mayuri</p>
                <nav class="space-y-2">
                    <button onclick="navigateTo('home')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">🏠 Home Dashboard</button>
                    <button onclick="navigateTo('search')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">🔍 Search</button>
                    <button onclick="navigateTo('watchlist')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">🎬 My Watchlist</button>
                    <button onclick="navigateTo('swipe')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">🔥 Swipe Match</button>
                    <button onclick="navigateTo('chat')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">🤖 AI Assistant</button>
                    <button onclick="navigateTo('profile')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">👤 Profile & Stats</button>
                    <button onclick="navigateTo('admin')" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/10 transition">🛡️ Admin Panel</button>
                </nav>
            </div>
            <button onclick="logout()" class="w-full py-2 bg-red-600/20 text-red-300 border border-red-500/30 rounded-lg hover:bg-red-600/30 transition">🚪 Logout</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-8" id="main-content"></main>
    </div>

    <script>
        let moviesData = {};
        let currentUser = localStorage.getItem('cinematch_user') || "Mayuri";
        let watchlist = [];
        let chatMessages = [];
        let authMode = 'login';

        async function init() {
            try {
                let res = await fetch('/api/movies');
                moviesData = await res.json();
            } catch (e) { console.error("Could not fetch movies", e); }

            setTimeout(() => {
                let splash = document.getElementById('page-splash');
                splash.style.transition = 'opacity 0.7s ease';
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.body.style.overflow = 'auto';

                    // Check if URL is a password reset link
                    const urlParams = new URLSearchParams(window.location.search);
                    const resetUser = urlParams.get('user');

                    if (resetUser) {
                        showResetPasswordScreen(resetUser);
                    } else {
                        let savedUser = localStorage.getItem('cinematch_user');
                        if (savedUser) {
                            handleLogin(savedUser);
                        } else {
                            showAuth();
                        }
                    }
                }, 700);
            }, 3800);
        }

        function setAuthMode(mode) {
            authMode = mode;
            showAuth();
        }

        function showAuth() {
            let auth = document.getElementById('auth-container');
            auth.style.display = 'flex';
            
            let isLogin = authMode === 'login';
            let isSignup = authMode === 'signup';
            let isForgot = authMode === 'forgot';

            auth.innerHTML = `
                <div class="glass-card p-8 w-full max-w-md">
                    <!-- Uncropped Logo Container -->
                    <div class="flex flex-col items-center mb-6">
                        <div style="width: 320px; display: flex; flex-direction: column; align-items: center;">
                            <svg width="85" height="55" viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="25" y="45" width="70" height="45" rx="3" fill="#FFFFFF"/>
                                <polygon points="52,57 52,77 70,67" fill="#0F1115"/>
                                <polygon points="25,40 22,25 92,15 95,30" fill="#FFFFFF"/>
                                <polygon points="35,38 32,23 42,22 45,37" fill="#0F1115"/>
                                <polygon points="55,35 52,20 62,19 65,34" fill="#0F1115"/>
                                <polygon points="75,32 72,17 82,16 85,31" fill="#0F1115"/>
                                <rect x="90" y="45" width="4" height="4" fill="#00B4D8"/>
                                <rect x="98" y="50" width="5" height="5" fill="#0077B6"/>
                                <rect x="93" y="60" width="3" height="3" fill="#00B4D8"/>
                                <rect x="105" y="55" width="6" height="6" fill="#0077B6"/>
                            </svg>
                            <div class="text-3xl mt-1 flex items-center justify-center gap-1 w-full" style="white-space: nowrap; overflow: visible;">
                                <span style="font-family: 'Kaushan Script', cursive; color: #FFFFFF;">CinemaMatch</span>
                                <span class="ai-gradient-text">AI</span>
                            </div>
                            <div style="display: flex; align-items: center; justify-content: center; margin-top: 3px; gap: 8px; width: 100%;">
                                <div style="height: 1px; width: 25px; background-color: #0077B6;"></div>
                                <span style="font-family: 'Inter', sans-serif; font-size: 8px; letter-spacing: 1.5px; color: #E0E0E0; text-transform: uppercase;">AI RECOMMENDS. YOU ENJOY.</span>
                                <div style="height: 1px; width: 25px; background-color: #0077B6;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="flex bg-black/40 p-1 rounded-lg mb-6 text-sm font-semibold">
                        <button onclick="setAuthMode('login')" class="flex-1 py-2 rounded-md transition ${isLogin ? 'bg-[#0077B6] text-white' : 'text-gray-400 hover:text-white'}">Login</button>
                        <button onclick="setAuthMode('signup')" class="flex-1 py-2 rounded-md transition ${isSignup ? 'bg-[#0077B6] text-white' : 'text-gray-400 hover:text-white'}">Sign Up</button>
                        <button onclick="setAuthMode('forgot')" class="flex-1 py-2 rounded-md transition ${isForgot ? 'bg-[#0077B6] text-white' : 'text-gray-400 hover:text-white'}">Forgot</button>
                    </div>

                    <!-- Inputs -->
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">${isSignup ? 'Username' : 'Username, Email or Phone'}</label>
                            <input type="text" id="userInput" placeholder="${isSignup ? 'e.g., Mayuri' : 'Enter username or phone'}" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none">
                        </div>

                        ${isSignup ? `
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">Email Address</label>
                            <input type="email" id="emailInput" placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">Phone Number</label>
                            <input type="tel" id="phoneInput" placeholder="10-digit mobile number" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none">
                        </div>
                        ` : ''}
                        
                        ${!isForgot ? `
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">Password</label>
                            <div class="relative">
                                <input type="password" id="passwordInput" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none pr-10">
                                <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-600 hover:text-black">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        ` : ''}

                        <p id="authError" class="text-red-400 text-xs text-center hidden"></p>

                        <button onclick="submitAuth()" class="w-full py-3 btn-primary mt-2">
                            ${isLogin ? 'Sign In' : isSignup ? 'Create Account' : 'Send Reset Link'}
                        </button>

                        <button onclick="handleGuest()" class="w-full py-2.5 bg-white/10 rounded-lg hover:bg-white/20 transition text-sm text-gray-300">
                            Continue as Guest
                        </button>
                    </div>
                </div>
            `;
        }

        // Interface for updating password via the email link
        function showResetPasswordScreen(usernameOrEmail) {
            let auth = document.getElementById('auth-container');
            auth.style.display = 'flex';

            auth.innerHTML = `
                <div class="glass-card p-8 w-full max-w-md">
                    <div class="flex flex-col items-center mb-6">
                        <div class="text-2xl font-bold mb-1 text-white">Change Password</div>
                        <p class="text-xs text-gray-400 text-center">Set a new password for account: <span class="text-cyan-400">${usernameOrEmail}</span></p>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">New Password</label>
                            <input type="password" id="newPasswordInput" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg bg-white text-black font-semibold focus:outline-none">
                        </div>
                        <p id="resetError" class="text-red-400 text-xs text-center hidden"></p>
                        <button onclick="submitNewPassword('${usernameOrEmail}')" class="w-full py-3 btn-primary">Update Password</button>
                    </div>
                </div>
            `;
        }

        async function submitNewPassword(identifier) {
            let newPass = document.getElementById('newPasswordInput').value.trim();
            let errEl = document.getElementById('resetError');
            errEl.classList.add('hidden');

            if (!newPass) {
                errEl.innerText = "Please enter a new password.";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                let res = await fetch('/api/login'), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({identifier: identifier, new_password: newPass})
                });
                let data = await res.json();
                if (res.ok) {
                    alert(data.message);
                    window.location.href = '/'; // Redirect back to login
                } else {
                    errEl.innerText = data.detail;
                    errEl.classList.remove('hidden');
                }
            } catch(e) {
                errEl.innerText = "Backend connection error.";
                errEl.classList.remove('hidden');
            }
        }

        function togglePassword() {
            let passInput = document.getElementById('passwordInput');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        async function submitAuth() {
            let errEl = document.getElementById('authError');
            errEl.classList.add('hidden');
            let val = document.getElementById('userInput').value.trim();

            if (authMode === 'signup') {
                let email = document.getElementById('emailInput').value.trim();
                let phone = document.getElementById('phoneInput').value.trim();
                let pass = document.getElementById('passwordInput').value.trim();
                
                if (!val || !email || !phone || !pass) {
                    errEl.innerText = "Please fill in all fields.";
                    errEl.classList.remove('hidden');
                    return;
                }

                try {
                    let res = await fetch('http://127.0.0.1:8000/api/signup', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: val, email: email, phone: phone, password: pass})
                    });
                    let data = await res.json();
                    if (res.ok) {
                        alert(data.message);
                        setAuthMode('login');
                    } else {
                        errEl.innerText = data.detail;
                        errEl.classList.remove('hidden');
                    }
                } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }

            } else if (authMode === 'login') {
                let pass = document.getElementById('passwordInput').value.trim();
                if (!val || !pass) {
                    errEl.innerText = "Please enter username/phone and password.";
                    errEl.classList.remove('hidden');
                    return;
                }

                try {
                    let res = await fetch('http://127.0.0.1:8000/api/login', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({identifier: val, password: pass})
                    });
                    let data = await res.json();
                    if (res.ok) {
                        handleLogin(data.username);
                    } else {
                        errEl.innerText = data.detail;
                        errEl.classList.remove('hidden');
                    }
                } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }

            } else if (authMode === 'forgot') {
                if (!val) {
                    errEl.innerText = "Please enter your registered email or phone.";
                    errEl.classList.remove('hidden');
                    return;
                }
                try {
                    let res = await fetch('http://127.0.0.1:8000/api/forgot', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({identifier: val})
                    });
                    let data = await res.json();
                    if (res.ok) {
                        let msg = data.message;
                        if(data.reset_link) {
                            msg += `\n\n(Fallback Link):\n${data.reset_link}`;
                        }
                        alert(msg);
                        setAuthMode('login');
                    } else {
                        errEl.innerText = data.detail;
                        errEl.classList.remove('hidden');
                    }
                } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }
            }
        }

        function handleGuest() {
            handleLogin("Mayuri");
        }

        function handleLogin(name) {
            currentUser = name;
            localStorage.setItem('cinematch_user', currentUser);
            document.getElementById('userDisplay').innerText = `User: ${currentUser}`;
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            navigateTo('home');
        }

        function navigateTo(page) {
            const content = document.getElementById('main-content');
            if (page === 'home') {
                content.innerHTML = `
                    <h2 class="text-3xl font-bold mb-2">Welcome back, ${currentUser}!</h2>
                    <p class="text-gray-400 mb-6">Ready for another adventure? AI has picked something special today.</p>
                    <div class="glass-card p-6 bg-cover bg-center rounded-xl mb-8 relative overflow-hidden" style="background-image: linear-gradient(to right, rgba(11,15,25,1) 0%, rgba(11,15,25,0.6) 50%, rgba(11,15,25,0) 100%), url('https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg');">
                        <h1 class="text-4xl font-extrabold uppercase mb-2">Interstellar</h1>
                        <p class="text-red-500 font-bold mb-2">⭐ 8.6 | Sci-Fi | 2014</p>
                        <p class="max-w-md text-gray-300 text-sm mb-4">Explorers travel through a wormhole in space to ensure humanity's survival.</p>
                        <button onclick="addToWatchlist('Interstellar')" class="px-4 py-2 btn-primary">+ Watchlist</button>
                    </div>
                    <h3 class="text-xl font-bold mb-4">🔥 Recommended For You (AI Hybrid)</h3>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                        ${Object.keys(moviesData).slice(0, 5).map(m => `
                            <div class="glass-card p-3 flex flex-col justify-between">
                                <img src="${moviesData[m].poster}" class="rounded-lg h-48 object-cover mb-2">
                                <h4 class="font-bold text-sm mb-1">${m}</h4>
                                <button onclick="addToWatchlist('${m}')" class="w-full py-1.5 bg-white/10 rounded text-xs hover:bg-white/20 transition">+ Watchlist</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (page === 'watchlist') {
                content.innerHTML = `
                    <h2 class="text-3xl font-bold mb-6">🎬 My Watchlist</h2>
                    <div class="space-y-4">
                        ${watchlist.length === 0 ? '<p class="text-gray-400">Your watchlist is empty.</p>' : watchlist.map(m => `
                            <div class="glass-card p-4 flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <img src="${moviesData[m]?.poster}" class="w-16 h-20 object-cover rounded">
                                    <div>
                                        <h4 class="font-bold text-lg">${m}</h4>
                                        <p class="text-sm text-gray-400">${moviesData[m]?.desc}</p>
                                    </div>
                                </div>
                                <button onclick="removeFromWatchlist('${m}')" class="px-3 py-1.5 bg-red-600/20 text-red-300 rounded text-sm">Remove</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (page === 'chat') {
                content.innerHTML = `
                    <h2 class="text-3xl font-bold mb-2">🤖 Ask CineMatch AI</h2>
                    <p class="text-gray-400 mb-6">Ask for highly personalized recommendations using Natural Language.</p>
                    <div class="glass-card p-6 flex flex-col h-[60vh] justify-between">
                        <div id="chatMessages" class="overflow-y-auto space-y-3 mb-4 flex-1 pr-2">
                            ${chatMessages.map(msg => `<div class="p-3 rounded-lg ${msg.role === 'user' ? 'bg-blue-600/30 ml-auto' : 'bg-gray-800'} max-w-lg">${msg.content}</div>`).join('')}
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="chatInput" placeholder="E.g., Suggest a sci-fi movie..." class="flex-1 px-4 py-3 rounded-lg bg-white text-black font-semibold focus:outline-none">
                            <button onclick="sendChat()" class="px-6 py-3 btn-primary">Send</button>
                        </div>
                    </div>
                `;
            } else if (page === 'admin') {
                content.innerHTML = `
                    <h2 class="text-3xl font-bold mb-2">🛡️ Admin & Analytics Dashboard</h2>
                    <p class="text-gray-400 mb-6">Platform metrics and ML model statuses for CineMatch AI.</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div class="glass-card p-4"><p class="text-gray-400 text-sm">Active Users</p><h3 class="text-2xl font-bold">1,245,039</h3></div>
                        <div class="glass-card p-4"><p class="text-gray-400 text-sm">Movies in DB</p><h3 class="text-2xl font-bold">45,902</h3></div>
                        <div class="glass-card p-4"><p class="text-gray-400 text-sm">AI Recs Served</p><h3 class="text-2xl font-bold">84M+</h3></div>
                        <div class="glass-card p-4"><p class="text-gray-400 text-sm">Avg Rating</p><h3 class="text-2xl font-bold">4.2 / 5.0</h3></div>
                    </div>
                    <div class="glass-card p-6 space-y-3">
                        <div class="flex items-center justify-between"><span>✅ Collaborative Filtering Engine (SVD)</span><span class="text-green-400 text-sm">Online (42ms)</span></div>
                        <div class="flex items-center justify-between"><span>✅ Content-Based Engine (Cosine)</span><span class="text-green-400 text-sm">Online (18ms)</span></div>
                        <div class="flex items-center justify-between"><span>✅ NLP Chat Assistant (Transformer)</span><span class="text-green-400 text-sm">Online (110ms)</span></div>
                    </div>
                `;
            } else {
                content.innerHTML = `<h2 class="text-3xl font-bold mb-4">${page.toUpperCase()}</h2><p class="text-gray-400">Module under active development.</p>`;
            }
        }

        function addToWatchlist(movie) {
            if(!watchlist.includes(movie)) { watchlist.push(movie); alert(`Added ${movie} to Watchlist!`); }
        }
        function removeFromWatchlist(movie) {
            watchlist = watchlist.filter(m => m !== movie);
            navigateTo('watchlist');
        }

        async function sendChat() {
            let input = document.getElementById('chatInput');
            let prompt = input.value.trim();
            if(!prompt) return;
            chatMessages.push({role: 'user', content: prompt});
            input.value = '';
            navigateTo('chat');

            let res = await fetch('http://127.0.0.1:8000/api/chat', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: prompt})
            });
            let data = await res.json();
            chatMessages.push({role: 'assistant', content: data.response});
            navigateTo('chat');
        }

        function logout() {
            localStorage.removeItem('cinematch_user');
            location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
