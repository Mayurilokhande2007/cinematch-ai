    <style>
        body { font-family: 'Inter', sans-serif; color: #F3F4F6; min-height: 100vh; margin: 0; overflow: hidden; }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        
        .bg-blended-gradient {
            background-color: #0A1931;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23FFFFFF' fill-opacity='0.03' transform='rotate(-15 200 200)'%3E%3Cg transform='translate(50, 80) scale(0.8)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(250, 40) scale(0.6)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(120, 250) scale(1.0)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(320, 280) scale(0.7)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3Cg transform='translate(200, 150) scale(0.5)'%3E%3Crect x='0' y='15' width='60' height='40' rx='4'/%3E%3Cpolygon points='0,10 60,0 60,12 0,22'/%3E%3Cpolygon points='25,25 25,45 45,35'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"), linear-gradient(180deg, #040D21 0%, #0A1931 50%, #004080 100%);
            background-attachment: fixed; background-size: auto, cover; min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(10, 25, 49, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .btn-primary {
            background: linear-gradient(to right, #00B4D8, #0077B6);
            color: white; border-radius: 8px; font-weight: 600; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 180, 216, 0.6); }
        
        .ai-gradient-text {
            font-family: 'Kaushan Script', cursive; background-clip: text;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #00B4D8, #0077B6);
            display: inline-block; padding-right: 5px;
        }
        @keyframes popUp { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes fadeOutLogo { to { opacity: 0; visibility: hidden; } }
        .splash-anim {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 999998; display: flex; flex-direction: column; align-items: center;
            opacity: 0; animation: popUp 1.5s 0.2s forwards, fadeOutLogo 0.5s 3.5s forwards;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 195, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 195, 255, 0.6); }

        @keyframes swipeRight { to { transform: translate(150%, 20deg) scale(0.8); opacity: 0; } }
        @keyframes swipeLeft { to { transform: translate(-150%, -20deg) scale(0.8); opacity: 0; } }
        .swiping-right { animation: swipeRight 0.5s forwards; }
        .swiping-left { animation: swipeLeft 0.5s forwards; }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>

        // ==========================================
        // INITIALIZATION
        // ==========================================
        async function init() {
            movieArray = Object.keys(verifiedPosters).map(key => ({
                title: key,
                ...verifiedPosters[key]
            }));
            
            movieArray = movieArray.sort(() => 0.5 - Math.random());
            document.getElementById('userDisplay').innerText = `USER: ${currentUser.toUpperCase()}`;
            
            setTimeout(() => {
                let splash = document.getElementById('page-splash');
                splash.style.transition = 'opacity 0.7s ease';
                splash.style.opacity = '0';
                
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.body.style.overflow = 'auto';
                    
                    let savedUser = localStorage.getItem('cinematch_user');
                    if (savedUser) {
                        handleLogin(savedUser);
                    } else {
                        showAuth();
                    }
                }, 700);
            }, 3800);
        }

        // ==========================================
        // NAVIGATION SYSTEM
        // ==========================================
        function navigateTo(page) {
            const content = document.getElementById('main-content');
            if (page === 'home') renderHome(content);
            else if (page === 'search') renderSearch(content);
            else if (page === 'watchlist') renderWatchlist(content);
            else if (page === 'swipe') renderSwipe(content);
            else if (page === 'chat') renderChat(content);
        }

        // ==========================================
        // 1. HOME DASHBOARD (21 Grid)
        // ==========================================
        function renderHome(content) {
            if (movieArray.length === 0) return;
            
            let filtered = movieArray.filter(m => activeMood === 'All' || m.mood === activeMood);

        // ==========================================

        // ==========================================
        // 5. AI ASSISTANT CHAT
        // ==========================================
        function renderChat(content) {
            let html = `
                <div class="flex flex-col h-full max-h-[85vh]">
                    <div class="mb-4">
                        <h2 class="text-3xl font-bold mb-1">🤖 AI Assistant</h2>

                        </div>

                    <div class="flex gap-3">
                        <input type="text" id="chatInput" placeholder="Describe the vibe or movie you are looking for..." class="flex-1 px-5 py-3.5 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-[#00c3ff] focus:ring-1 focus:ring-[#00c3ff]" onkeypress="if(event.key === 'Enter') sendChat()">
                        <button onclick="sendChat()" class="px-6 py-3.5 btn-primary rounded-xl flex items-center justify-center shadow-lg"><i class="ph-bold ph-paper-plane-right text-xl"></i></button>
                    </div>
                </div>
            `;
            content.innerHTML = html;
            scrollToBottom();
        }

        async function sendChat() {
            let input = document.getElementById('chatInput');
            let prompt = input.value.trim();
            if(!prompt) return;

            chatMessages.push({role: 'user', content: prompt});
            input.value = '';
            renderChat(document.getElementById('main-content'));
            
            document.getElementById('typingIndicator').classList.remove('hidden');
            scrollToBottom();

            try {
                let res = await fetch('/api/chat', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                let data = await res.json();
                chatMessages.push({role: 'assistant', content: data.response});
            } catch(e) {
                chatMessages.push({role: 'assistant', content: "I recommend exploring our curated categories on the dashboard!"});
            }

            renderChat(document.getElementById('main-content'));
        }

        function scrollToBottom() {
            let feed = document.getElementById('chatFeed');
            if(feed) feed.scrollTop = feed.scrollHeight;
        }

        // ==========================================

            showAuth();
        }

                                <span class="ai-gradient-text">AI</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex bg-black/40 p-1 rounded-lg mb-6 text-sm font-semibold">
                        <button onclick="setAuthMode('login')" class="flex-1 py-2 rounded-md transition ${isLogin ? 'bg-[#0077B6] text-white' : 'text-gray-400 hover:text-white'}">Login</button>
                        <button onclick="setAuthMode('signup')" class="flex-1 py-2 rounded-md transition ${isSignup ? 'bg-[#0077B6] text-white' : 'text-gray-400 hover:text-white'}">Sign Up</button>
                        <button onclick="setAuthMode('forgot')" class="flex-1 py-2 rounded-md transition ${isForgot ? 'bg-[#0077B6] text-white' : 'text-gray-400 hover:text-white'}">Forgot</button>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">${isSignup ? 'Username' : 'Username, Email or Phone'}</label>
                            <input type="text" id="userInput" placeholder="${isSignup ? 'e.g., Mayuri' : 'Enter username or phone'}" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none">
                        </div>
                        ${isSignup ? `
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">Email Address</label>
                            <input type="email" id="emailInput" placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none">

                            <input type="tel" id="phoneInput" placeholder="10-digit mobile number" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none">

                        ` : ''}
                        
                        ${!isForgot ? `
                        <div>

                            <div class="relative">
                                <input type="password" id="passwordInput" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg bg-white text-black font-semibold focus:outline-none pr-10">
                                <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-600 hover:text-black">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>

        function showResetPasswordScreen(usernameOrEmail) {
            let auth = document.getElementById('auth-container');
            auth.style.display = 'flex';
            auth.innerHTML = `
                <div class="glass-card p-8 w-full max-w-md">
                    <div class="flex flex-col items-center mb-6">
                        <div class="text-2xl font-bold mb-1 text-white">Change Password</div>

                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">New Password</label>
                            <input type="password" id="newPasswordInput" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg bg-white text-black font-semibold focus:outline-none">
                        </div>
                        <p id="resetError" class="text-red-400 text-xs text-center hidden"></p>

                    </div>
                </div>

        async function submitNewPassword(identifier) {
            let newPass = document.getElementById('newPasswordInput').value.trim();
            let errEl = document.getElementById('resetError');
            errEl.classList.add('hidden');
            if (!newPass) { errEl.innerText = "Please enter a new password."; errEl.classList.remove('hidden'); return; }
            try {
                let res = await fetch('/api/reset-password', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: identifier, new_password: newPass})
                });
                let data = await res.json();
                if (res.ok) { alert(data.message); window.location.href = '/'; } 
                else { errEl.innerText = data.detail; errEl.classList.remove('hidden'); }
            } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }
        }

        function togglePassword() {
            let passInput = document.getElementById('passwordInput');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        async function submitAuth() {
            let errEl = document.getElementById('authError');
            errEl.classList.add('hidden');
            let val = document.getElementById('userInput').value.trim();
            
            if (authMode === 'signup') {
                let email = document.getElementById('emailInput').value.trim();
                let phone = document.getElementById('phoneInput').value.trim();
                let pass = document.getElementById('passwordInput').value.trim();
                
                if (!val || !email || !phone || !pass) { errEl.innerText = "Please fill in all fields."; errEl.classList.remove('hidden'); return; }
                try {
                    let res = await fetch('/api/signup', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: val, email: email, phone: phone, password: pass})
                    });
                    let data = await res.json();
                    if (res.ok) { alert(data.message); setAuthMode('login'); } 
                    else { errEl.innerText = data.detail; errEl.classList.remove('hidden'); }
                } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }
            } else if (authMode === 'login') {
                let pass = document.getElementById('passwordInput').value.trim();
                if (!val || !pass) { errEl.innerText = "Please enter username/phone and password."; errEl.classList.remove('hidden'); return; }
                try {
                    let res = await fetch('/api/login', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({identifier: val, password: pass})
                    });
                    let data = await res.json();
                    if (res.ok) { handleLogin(data.username); } 
                    else { errEl.innerText = data.detail; errEl.classList.remove('hidden'); }
                } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }
            } else if (authMode === 'forgot') {
                if (!val) { errEl.innerText = "Please enter your registered email or phone."; errEl.classList.remove('hidden'); return; }
                try {
                    let res = await fetch('/api/forgot', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({identifier: val})
                    });
                    let data = await res.json();
                    if (res.ok) { alert(data.message); setAuthMode('login'); } 
                    else { errEl.innerText = data.detail; errEl.classList.remove('hidden'); }
                } catch(e) { errEl.innerText = "Backend connection error."; errEl.classList.remove('hidden'); }
            }
        }

        function handleGuest() { handleLogin("Mayuri"); }

        function handleLogin(name) {
            currentUser = name;
            localStorage.setItem('cinematch_user', currentUser);
            document.getElementById('userDisplay').innerText = `USER: ${currentUser.toUpperCase()}`;
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            navigateTo('home');
        }

        function logout() { localStorage.removeItem('cinematch_user'); location.reload(); }

        window.onload = init;
    </script>
</body>
</html>
